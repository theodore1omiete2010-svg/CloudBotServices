<div class="workspace-view" id="view-notifications">
<div class="page-header">
<div>
<div class="eyebrow">SYSTEM ALERTS</div>
<h1>Notifications</h1>
<p>Stay updated on orders, bot handoffs, and system alerts.</p>
</div>
<div class="header-actions">
<button class="button" id="markAllReadBtn">Mark all as read</button>
</div>
</div>

<!-- Search Bar -->
<div class="page-search-row">
<input id="notifSearch" placeholder="Search notifications..."/>
</div>

<!-- Filter Pills -->
<div class="filter-group">
<span class="filter-pill active" data-filter="all">All</span>
<span class="filter-pill" data-filter="unread">Unread</span>
<span class="filter-pill" data-filter="read">Read</span>
</div>

<!-- Data List -->
<div id="notificationList" class="data-list"></div>
</div>
