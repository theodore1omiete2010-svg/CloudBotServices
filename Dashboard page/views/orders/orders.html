<div class="workspace-view" id="view-orders">
<div class="page-header">
<div>
<div class="eyebrow">COMMERCE</div>
<h1>Orders</h1>
<p>Track orders from creation through payment and fulfilment.</p>
</div>
<div class="header-actions">
<button class="button" data-action="export">Export</button>
<button class="button primary" id="openCreateOrderBtn">+ Create Order</button>
</div>
</div>

<!-- Metrics Strip -->
<div class="metric-strip">
<div class="metric-box"><div class="label">Today</div><div class="value" id="ordersToday">0</div><div class="meta">Orders</div></div>
<div class="metric-box"><div class="label">Pending</div><div class="value" id="ordersPending">0</div><div class="meta">Awaiting action</div></div>
<div class="metric-box"><div class="label">Paid</div><div class="value" id="ordersPaid">₦0</div><div class="meta">Collected</div></div>
<div class="metric-box"><div class="label">Fulfilled</div><div class="value" id="ordersFulfilled">0%</div><div class="meta">Completion rate</div></div>
</div>

<div class="card surface-card">
<!-- Search Bar -->
<div class="page-search-row">
<input id="ordersSearch" placeholder="Search order ID or customer..."/>
</div>

<!-- Filter Pills -->
<div class="filter-group">
<span class="filter-pill active" data-filter="all">All</span>
<span class="filter-pill" data-filter="pending">Pending</span>
<span class="filter-pill" data-filter="paid">Paid</span>
<span class="filter-pill" data-filter="fulfilled">Fulfilled</span>
<span class="filter-pill" data-filter="cancelled">Cancelled</span>
</div>

<!-- Data List -->
<div id="ordersList" class="data-list"></div>
</div>
</div>

<!-- ========================================== -->
<!-- CREATE ORDER MODAL (Hidden by default)      -->
<!-- ========================================== -->
<div id="createOrderModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-eyebrow">NEW ORDER</div>
        <div class="modal-title">Create Order</div>
      </div>
      <button class="modal-close" id="closeCreateOrderBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="newCustomerName">Customer Name</label>
        <input type="text" id="newCustomerName" placeholder="e.g. Ngozi E." />
      </div>
      <div class="form-group">
        <label for="newOrderItems">Items (Name x Quantity)</label>
        <input type="text" id="newOrderItems" placeholder="e.g. Jollof Rice x2" />
      </div>
      <div class="form-group">
        <label for="newOrderTotal">Total Amount (₦)</label>
        <input type="number" id="newOrderTotal" placeholder="e.g. 2500" min="0" />
      </div>
      <div class="form-row">
        <div class="form-group half">
          <label for="newOrderChannel">Channel</label>
          <select id="newOrderChannel">
            <option value="WhatsApp">WhatsApp</option>
            <option value="Web Chat">Web Chat</option>
            <option value="Instagram">Instagram</option>
            <option value="Direct">Direct</option>
          </select>
        </div>
        <div class="form-group half">
          <label for="newOrderStatus">Status</label>
          <select id="newOrderStatus">
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="fulfilled">Fulfilled</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="button" id="cancelCreateOrderBtn">Cancel</button>
      <button class="button primary" id="saveCreateOrderBtn">Save Order</button>
    </div>
  </div>
</div>
